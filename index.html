<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMG-01</title>
  <style>
    :root {
      --bg: #101216;
      --panel: #1a1e25;
      --shell: #b9b5ac;
      --shell-dark: #8f8b82;
      --bezel: #3d4551;
      --text: #d6dae0;
      --dim: #7c828c;
      --accent: #88c070;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 32px 16px;
    }
    h1 { font-size: 20px; letter-spacing: 3px; font-weight: 600; }
    h1 span { color: var(--accent); }
    .tagline { color: var(--dim); font-size: 12px; margin-top: -12px; }

    .shell {
      background: linear-gradient(160deg, var(--shell), var(--shell-dark));
      border-radius: 12px 12px 40px 12px;
      padding: 22px 26px 30px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .bezel {
      background: var(--bezel);
      border-radius: 8px 8px 24px 8px;
      padding: 18px 34px 22px;
    }
    .bezel-label {
      color: #a8b0bc;
      font-size: 9px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 8px;
    }
    canvas {
      display: block;
      width: 480px;
      height: 432px;
      image-rendering: pixelated;
      background: #e0f8d0;
    }

    .controls { display: flex; gap: 10px; align-items: center; }
    button, .file-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #2c323c;
      border-radius: 6px;
      padding: 8px 16px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover, .file-btn:hover { border-color: var(--accent); }
    input[type="file"] { display: none; }
    #rom-info { color: var(--dim); font-size: 12px; }
    #rom-info b { color: var(--accent); font-weight: 600; }

    .keys { color: var(--dim); font-size: 12px; }
    .keys kbd {
      background: var(--panel);
      border: 1px solid #2c323c;
      border-radius: 4px;
      padding: 1px 6px;
      margin: 0 2px;
    }

    #serial-panel {
      display: none;
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid #2c323c;
      border-radius: 8px;
      padding: 12px 16px;
    }
    #serial-panel h2 { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
    #serial-out { font-size: 12px; white-space: pre-wrap; word-break: break-all; }

    #error {
      display: none;
      color: #e07070;
      font-size: 13px;
      max-width: 560px;
      text-align: center;
    }
    footer { color: var(--dim); font-size: 11px; margin-top: auto; padding-top: 12px; }

    @media (prefers-color-scheme: light) {
      :root { --bg: #e8e6e0; --panel: #f5f4f0; --text: #23262b; --dim: #6b7078; }
      button, .file-btn, .keys kbd, #serial-panel { border-color: #cfccc4; }
    }
  </style>
</head>
<body>
  <h1>DMG<span>-</span>01</h1>
  <p class="tagline">a Game Boy emulator, from scratch</p>

  <div class="shell">
    <div class="bezel">
      <div class="bezel-label">DOT MATRIX WITH STEREO SOUND</div>
      <canvas id="screen" width="160" height="144"></canvas>
    </div>
  </div>

  <div class="controls">
    <label class="file-btn">Load ROM<input type="file" id="rom-input" accept=".gb,.bin" /></label>
    <button id="reset-btn">Reset</button>
    <button id="sound-btn">&#128263; sound</button>
    <span id="rom-info"><b>SCROLL DEMO</b> · built-in · <span id="fps"></span></span>
  </div>

  <p class="keys">
    <kbd>←↑↓→</kbd> d-pad &nbsp; <kbd>X</kbd> A &nbsp; <kbd>Z</kbd> B &nbsp;
    <kbd>Enter</kbd> Start &nbsp; <kbd>Shift</kbd> Select &nbsp; drag a .gb file anywhere
  </p>

  <p id="error"></p>

  <div id="serial-panel">
    <h2>SERIAL OUT — test ROMs print results here</h2>
    <div id="serial-out"></div>
  </div>

  <footer>SM83 core · scanline PPU · 4-channel APU · MBC 0/1/3</footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
